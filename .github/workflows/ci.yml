name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every run uses the same user and so the same balance: one run at a time.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install poetry==2.3.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Check formatting
        run: poetry run ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      QA_USER_ID: ${{ secrets.QA_USER_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install poetry==2.3.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest -rxX
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/
          if-no-files-found: ignore
